<div class="auth-card">
  <h1 class="auth-title">Connexion</h1>
  <p class="auth-subtitle">Heureux de vous revoir. Connectez-vous pour retrouver vos présentations.</p>

  @if (serverError(); as error) {
    <p class="form-error" role="alert">{{ error }}</p>
  }

  <bp-configurable-form
    [structure]="structure"
    (onFormSubmit)="submit($event)"
    [verboseError]="false"
  />

  <p class="auth-status" role="status" aria-live="polite">
    @if (submitting()) {
      Connexion en cours…
    }
  </p>

  <p class="auth-footer">Pas encore de compte ? <a routerLink="/inscription">Créer un compte</a></p>
  <p class="auth-footer"><a routerLink="/">Retour à l'accueil</a></p>
</div>
