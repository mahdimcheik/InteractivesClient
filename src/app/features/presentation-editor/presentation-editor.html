<div class="editor-shell">
  <app-editor-header
    [presentationTitle]="presentationTitle()"
    [canPresent]="!!presentation()?.slides?.length"
    [live]="liveInfo()"
    [startingLive]="startingLive()"
    (rename)="openRenameModal()"
    (present)="isPresenting.set(true)"
    (goLive)="goLive()"
    (endLive)="endLiveModalVisible.set(true)"
  ></app-editor-header>
  <app-editor-toolbar />

  <main class="editor-workspace">
    <app-slide-panel
      [presentation]="presentation()"
      [selectedSlideIndex]="selectedSlideIndex()"
      (slideSelected)="selectedSlideIndex.set($event)"
    />
    <app-slide-canvas
      [presentation]="presentation()"
      [selectedSlideIndex]="selectedSlideIndex()"
      [(selectedElementId)]="selectedElementId"
    />
    <app-properties-panel
      [presentationId]="presentation()?.id"
      [slide]="selectedSlide()"
      [element]="selectedElement()"
    />
  </main>
</div>

<app-presentation-name-modal
  [(visible)]="isNameModalOpen"
  [initialTitle]="nameModalInitialTitle()"
  [heading]="isNewPresentation() ? 'Nommer votre présentation' : 'Renommer la présentation'"
  [confirmLabel]="isNewPresentation() ? 'Créer' : 'Enregistrer'"
  [dismissible]="!isNewPresentation()"
  [saving]="savingName()"
  (confirmed)="saveName($event)"
/>

@if (isPresenting() && presentation(); as p) {
  <app-slideshow-player
    [presentation]="p"
    [startIndex]="liveSession() ? liveConnection.currentSlideIndex() : selectedSlideIndex()"
    [live]="liveInfo()"
    (indexChange)="onPresentedSlideChange($event)"
    (closed)="stopPresenting($event)"
  />
}

<app-confirm-delete-modal
  [(visible)]="endLiveModalVisible"
  heading="Terminer la séance"
  message="Les participants seront déconnectés. Vous pourrez démarrer une nouvelle séance plus tard."
  confirmLabel="Terminer"
  [deleting]="endingLive()"
  (confirmed)="endLive()"
/>
