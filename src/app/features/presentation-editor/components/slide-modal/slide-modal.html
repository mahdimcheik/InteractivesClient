<ejs-dialog
  [(visible)]="visible"
  [isModal]="true"
  [closeOnEscape]="true"
  [showCloseIcon]="true"
  [allowDragging]="false"
  [enableResize]="false"
  [width]="'min(90vw, 420px)'"
  cssClass="slide-modal"
  (close)="close()"
  (overlayClick)="close()"
>
  <ng-template #header>
    <h3 class="modal-title">{{ heading() }}</h3>
  </ng-template>

  <ng-template #content>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="slide-background-color">Couleur d'arrière-plan</label>
        <input
          type="color"
          ejs-colorpicker
          id="slide-background-color"
          formControlName="backgroundColor"
          class="slide-modal-color-input"
        />
      </div>
    </form>
  </ng-template>

  <ng-template #footerTemplate>
    <div class="modal-footer">
      <button type="button" ejs-button cssClass="e-outline" (click)="close()">Annuler</button>
      <button
        type="button"
        ejs-button
        cssClass="!bg-[var(--app-primary-color)] !text-[var(--app-primary-contrast-color)]"
        [disabled]="saving()"
        (click)="submit()"
      >
        {{ saving() ? 'Enregistrement…' : confirmLabel() }}
      </button>
    </div>
  </ng-template>
</ejs-dialog>
