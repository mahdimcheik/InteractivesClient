<aside class="slide-panel">
  <div class="panel-header">
    <span class="panel-title">Diapositives</span>
    <button type="button" class="grid-view-button" title="Vue en grille" aria-label="Vue en grille">
      <i class="pi pi-grid-2" aria-hidden="true"></i>
    </button>
  </div>

  <div
    class="thumbnail-list"
    cdkDropList
    (cdkDropListDropped)="onDrop($event)"
    [cdkDropListDisabled]="!presentationId()"
  >
    @for (slide of slides(); track slide.id) {
      <div class="thumbnail-row" cdkDrag [cdkDragDisabled]="!presentationId()">
        <div
          class="thumbnail-index"
          [class.thumbnail-index-active]="$index === selectedSlideIndex()"
        >
          {{ $index + 1 }}
        </div>

        <div class="thumbnail-topbar">
          <button
            type="button"
            class="thumbnail-topbar-button"
            [attr.aria-label]="'Modifier l\'arrière-plan de la diapositive ' + ($index + 1)"
            (click)="$event.stopPropagation(); openEditModal(slide)"
          >
            <i class="pi pi-pencil" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            class="thumbnail-topbar-button thumbnail-drag-handle"
            cdkDragHandle
            [attr.aria-label]="'Réordonner la diapositive ' + ($index + 1)"
            (click)="$event.stopPropagation()"
          >
            <i class="pi pi-bars" aria-hidden="true"></i>
          </button>
        </div>

        <button
          type="button"
          class="thumbnail"
          [class.thumbnail-active]="$index === selectedSlideIndex()"
          (click)="slideSelected.emit($index)"
        >
          @if ($index === selectedSlideIndex()) {
            <div class="thumbnail-active-bar" aria-hidden="true"></div>
          }

          <div class="thumbnail-content thumbnail-content-split">
            <div class="thumbnail-image-block"></div>
            <div class="thumbnail-text-block"></div>
          </div>
        </button>
      </div>
    }

    <button
      type="button"
      class="new-slide-button"
      aria-label="Nouvelle diapositive"
      [disabled]="!presentationId()"
      (click)="openAddModal()"
    >
      <i class="pi pi-plus" aria-hidden="true"></i>
      Nouvelle diapositive
    </button>
  </div>
</aside>

<app-slide-modal
  [(visible)]="slideModalVisible"
  [mode]="slideModalMode()"
  [initialColor]="editingSlide()?.backgroundColor ?? '#ffffff'"
  [saving]="savingSlide()"
  (confirmed)="onSlideModalConfirm($event)"
/>
