<header class="editor-header">
  <div class="header-left">
    <div class="presentation-info">
      <div class="presentation-title-row">
        <span class="presentation-title">{{ presentationTitle() }}</span>
        <button
          type="button"
          ejs-button
          cssClass="e-flat e-round e-icon-btn edit-icon-button"
          title="Renommer la présentation"
          aria-label="Renommer la présentation"
          (click)="rename.emit()"
        >
          <i class="pi pi-pencil edit-icon" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <nav class="header-nav" aria-label="Navigation de l'éditeur">
    <a routerLink="/dashboard/presentations" class="nav-link">Mes présentations</a>
    <span class="nav-link nav-link-active" aria-current="page">Éditeur</span>
  </nav>

  <div class="header-actions">
    <button
      id="editor-present-button"
      type="button"
      ejs-button
      cssClass="e-outline !px-4 !py-2 !rounded-lg"
      [disabled]="!canPresent()"
      (click)="present.emit()"
    >
      <i class="pi pi-desktop" aria-hidden="true"></i>
      Présenter
    </button>

    @if (live(); as session) {
      <p class="live-badge" role="status">
        <span class="live-dot" aria-hidden="true"></span>
        En direct · <span class="live-code">{{ session.code }}</span> ·
        {{ session.participantCount }}
        {{ session.participantCount > 1 ? 'participants' : 'participant' }}
      </p>
      <button
        type="button"
        ejs-button
        cssClass="e-outline !px-4 !py-2 !rounded-lg"
        (click)="endLive.emit()"
      >
        Terminer la séance
      </button>
    }

    <button
      type="button"
      ejs-button
      cssClass="!bg-[var(--app-primary-color)] !text-[var(--app-primary-contrast-color)] !px-4 !py-2 !rounded-lg go-live-button"
      [disabled]="!canPresent() || startingLive()"
      (click)="goLive.emit()"
    >
      <i class="pi pi-play" aria-hidden="true"></i>
      {{ live() ? 'Reprendre le direct' : 'Démarrer en direct' }}
    </button>

    <button type="button" class="avatar-button" aria-label="Profil utilisateur">
      <span class="avatar-initials">SJ</span>
    </button>
  </div>
</header>
