<a class="app-skip-link" href="#contenu">Aller au contenu principal</a>

<header class="topbar">
  <button
    type="button"
    class="sidebar-button"
    ejs-button
    cssClass="e-flat e-round e-icon-btn"
    #toggleButtonEl
    aria-controls="navigation-dashboard"
    [attr.aria-expanded]="toggleAriaExpanded()"
    [attr.aria-label]="toggleAriaLabel()"
    (click)="toggleSidebar()"
  >
    <i
      class="pi"
      [class.pi-bars]="isMobile() && !mobileOpen()"
      [class.pi-times]="isMobile() && mobileOpen()"
      [class.pi-chevron-left]="!isMobile() && !desktopCollapsed()"
      [class.pi-chevron-right]="!isMobile() && desktopCollapsed()"
      aria-hidden="true"
    ></i>
  </button>

  <a routerLink="/" class="brand">Interactives</a>

  <div class="topbar-actions">
    <span class="user-name">{{ fullName() }}</span>
    <app-theme-toggle />
    <button type="button" ejs-button cssClass="e-outline" (click)="logout()">Déconnexion</button>
  </div>
</header>

<div class="shell">
  <div
    class="sidebar-backdrop"
    [hidden]="!isOverlayVisible()"
    (click)="closeMobileMenu(true)"
  ></div>

  <nav
    id="navigation-dashboard"
    class="sidebar"
    #navPanel
    tabindex="-1"
    aria-label="Navigation du tableau de bord"
    [class.is-open]="mobileOpen()"
    [class.is-collapsed]="isIconOnly()"
    [hidden]="!isNavVisible()"
  >
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="is-active"
            #active="routerLinkActive"
            class="!min-h-12 w-auto"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            [attr.aria-current]="active.isActive ? 'page' : null"
            [attr.title]="isIconOnly() ? link.label : null"
            (click)="closeMobileMenu(false)"
          >
            <i class="pi" [class]="link.icon" aria-hidden="true"></i>
            <span class="link-label">{{ link.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <main id="contenu" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
