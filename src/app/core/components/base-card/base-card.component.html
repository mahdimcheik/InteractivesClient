<div class="w-full overflow-hidden rounded-lg border border-surface-200 bg-white dark:border-surface-600 dark:bg-surface-900" [class]="cardClass()">
    <div class="flex flex-col">
        <div class="flex items-start justify-between gap-2 px-5 py-4 border-b border-surface-200 dark:border-surface-600" [class]="headerClass()">
            <ejs-tooltip
                class="flex flex-col flex-1 min-w-0"
                [content]="headerTooltip()"
                [position]="syncfusionTooltipPosition[tooltipPosition()]"
                [opensOn]="headerTooltip() ? 'Hover' : 'Custom'"
            >
                <ng-content select="[header]"></ng-content>
            </ejs-tooltip>

            <div class="flex items-center gap-1 shrink-0 empty:hidden">
                <ng-content select="[controls]"></ng-content>
            </div>
        </div>

        <div class="flex-1 flex flex-col p-5" [class]="bodyClass()">
            <ng-content select="[body]"></ng-content>
        </div>

        <div class="flex flex-col px-5 py-4 border-t border-surface-200 dark:border-surface-600 empty:hidden" [class]="footerClass()">
            <ng-content select="[footer]"></ng-content>
        </div>
    </div>
</div>
