<ejs-sidebar
  [(isOpen)]="visible"
  [position]="position()"
  [width]="width()"
  [type]="'Over'"
  [showBackdrop]="true"
  [closeOnDocumentClick]="true"
  (close)="onHide()"
>
  <div class="base-side-modal flex flex-col h-full">
    <div class="flex items-center justify-between gap-3 w-full min-w-[300px]">
      <div class="flex items-center gap-3">
        <i [class]="iconClass()" class="text-2xl"></i>
        <span class="text-md font-semibold text-gray-800 dark:text-white m-0">{{ title() }}</span>
      </div>
    </div>

    <div class="flex-1 flex flex-col gap-3 w-full min-w-[300px] overflow-auto">
      <ng-content select="[content]"></ng-content>
    </div>

    <div class="flex items-center justify-between gap-3 w-full min-h-[25px] min-w-[300px]">
      <ng-content select="[footer-start]"></ng-content>
      <ng-content select="[footer-end]"></ng-content>
    </div>
  </div>
</ejs-sidebar>
